name: dcs-lua-api deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-proxy-dev-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '24'

jobs:
  ci:
    if: github.ref_name == 'dev'
    name: Validate backend-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  publish:
    if: github.ref_name == 'dev'
    name: Build and publish container
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_tag: ${{ steps.tags.outputs.primary_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vpc-backend-proxy" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: |
          set -eu
          sha_tag="sha-${GITHUB_SHA}"
          { echo "primary_tag=$sha_tag"; echo 'tags<<EOF'; printf '%s\n' "$IMAGE_NAME:$sha_tag" "$IMAGE_NAME:dev"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=backend-proxy-dev
          cache-to: type=gha,mode=max,scope=backend-proxy-dev

  deploy:
    name: Deploy DCS LUA HTTP API to dev VPS
    needs: publish
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!key:-}" ]; then echo "$key is required." >&2; exit 1; fi
          done

      - name: Deploy Docker service on dev VPS
        uses: appleboy/ssh-action@v1.2.1
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export BACKEND_PROXY_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            deploy/compose-dev-deploy.sh backend-proxy BACKEND_PROXY_IMAGE "$BACKEND_PROXY_IMAGE"
            docker compose -f docker-compose.dev.yml exec -T backend-proxy wget -qO- http://127.0.0.1:4006/ >/dev/null
            docker image prune -f
